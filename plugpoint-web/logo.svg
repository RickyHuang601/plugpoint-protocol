<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">PlugPoint Protocol logo</title>
  <desc id="desc">A cyber gaming token badge combining a power plug, letter P, and lightning bolt.</desc>
  <defs>
    <linearGradient id="rim" x1="88" y1="72" x2="426" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.48" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#18e0ff"/>
    </linearGradient>
    <linearGradient id="plug" x1="154" y1="128" x2="348" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.44" stop-color="#f7b52c"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
    <linearGradient id="bolt" x1="304" y1="157" x2="214" y2="371" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bff8ff"/>
      <stop offset="0.5" stop-color="#22e2ff"/>
      <stop offset="1" stop-color="#00a8ff"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="43%" r="62%">
      <stop offset="0" stop-color="#102b43"/>
      <stop offset="0.58" stop-color="#071521"/>
      <stop offset="1" stop-color="#02070d"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="214" fill="url(#core)" stroke="url(#rim)" stroke-width="16"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="#39dff5" stroke-opacity="0.18" stroke-width="3" stroke-dasharray="18 13"/>
  <path d="M104 256h32M376 256h32M256 104v25M256 383v25" stroke="#ffd166" stroke-opacity="0.75" stroke-width="8" stroke-linecap="round"/>

  <g filter="url(#glow)">
    <rect x="174" y="112" width="30" height="72" rx="12" fill="url(#plug)"/>
    <rect x="244" y="112" width="30" height="72" rx="12" fill="url(#plug)"/>
    <path d="M151 166h119c67 0 108 37 108 96 0 61-43 99-111 99h-38v45h-78V166Zm78 63v70h33c25 0 39-13 39-35 0-23-14-35-39-35h-33Z" fill="url(#plug)"/>
    <path d="M294 146 218 274h55l-43 105 96-139h-58l26-94Z" fill="url(#bolt)" stroke="#d9fbff" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
</svg>
